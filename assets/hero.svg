<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Sergio Eliseo — Lic. en Informática</title>
  <desc id="d">Banner de perfil con roles que rotan: Lic. en Informática; Backend, Frontend y Móvil; Java, Python y C#; React y React Native; Docker, Linux y SQL; Apasionado por la tecnología.</desc>
  <style>
    .serif{font-family:Georgia,'Times New Roman','DejaVu Serif',serif}
    .mono{font-family:'SF Mono','Fira Code',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .r{opacity:0;animation:cyc 18s infinite;animation-fill-mode:backwards}
    .r2{animation-delay:3s}.r3{animation-delay:6s}.r4{animation-delay:9s}.r5{animation-delay:12s}.r6{animation-delay:15s}
    @keyframes cyc{0%{opacity:0;transform:translateY(10px)}2.5%{opacity:1;transform:translateY(0)}14%{opacity:1;transform:translateY(0)}16.6%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
    .fl{animation:fl 6s ease-in-out infinite}
    .fl2{animation-delay:-1.5s}.fl3{animation-delay:-3s}.fl4{animation-delay:-4.5s}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @media (prefers-reduced-motion:reduce){.r,.fl{animation:none}.r1{opacity:1}}
  </style>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#21262D"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="22" fill="#0D1117"/>
  <rect width="1200" height="420" rx="22" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="21.5" fill="none" stroke="#30363D"/>

  <!-- encabezado tipo archivo -->
  <rect x="70" y="56" width="10" height="10" fill="#FF5C39"/>
  <text x="92" y="66" class="mono" font-size="17" fill="#8B949E" letter-spacing="1">~/ChekoPc/perfil.md</text>

  <!-- nombre -->
  <text x="70" y="140" class="serif" font-size="38" font-style="italic" fill="#8B949E">Hola, soy</text>
  <text x="66" y="232" class="serif" font-size="96" font-weight="700" fill="#EDE8DF" letter-spacing="-2">Sergio Eliseo</text>
  <rect x="70" y="256" width="64" height="4" fill="#FF5C39"/>
  <text x="70" y="298" class="mono" font-size="21" fill="#8B949E">Egresado de la Licenciatura en Informática</text>

  <!-- roles rotativos -->
  <g class="mono" font-size="32" font-weight="600">
    <text x="70" y="366" fill="#FF5C39">›</text>
    <g fill="#EDE8DF">
      <text class="r r1" x="104" y="366">Lic. en Informática</text>
      <text class="r r2" x="104" y="366">Backend • Frontend • Móvil</text>
      <text class="r r3" x="104" y="366">Java • Python • C#</text>
      <text class="r r4" x="104" y="366">React • React Native</text>
      <text class="r r5" x="104" y="366">Docker • Linux • SQL</text>
      <text class="r r6" x="104" y="366">Apasionado por la tecnología</text>
    </g>
  </g>

  <!-- pila isométrica: capas del stack -->
  <g transform="translate(890 0)">
    <g class="fl fl4"><g transform="translate(0 300)">
      <polygon points="0,-60 125,0 0,60 -125,0" fill="#161B22" stroke="#30363D"/>
      <polygon points="-125,0 0,60 0,84 -125,24" fill="#10151C" stroke="#30363D"/>
      <polygon points="125,0 0,60 0,84 125,24" fill="#0D1117" stroke="#30363D"/>
    </g></g>
    <g class="fl fl3"><g transform="translate(0 240)">
      <polygon points="0,-60 125,0 0,60 -125,0" fill="#1C232C" stroke="#3D4650"/>
      <polygon points="-125,0 0,60 0,84 -125,24" fill="#141A22" stroke="#3D4650"/>
      <polygon points="125,0 0,60 0,84 125,24" fill="#10151C" stroke="#3D4650"/>
    </g></g>
    <g class="fl fl2"><g transform="translate(0 180)">
      <polygon points="0,-60 125,0 0,60 -125,0" fill="#232C37" stroke="#59636E"/>
      <polygon points="-125,0 0,60 0,84 -125,24" fill="#1A222B" stroke="#59636E"/>
      <polygon points="125,0 0,60 0,84 125,24" fill="#141A22" stroke="#59636E"/>
    </g></g>
    <g class="fl"><g transform="translate(0 120)">
      <polygon points="0,-60 125,0 0,60 -125,0" fill="#FF5C39" fill-opacity=".16" stroke="#FF5C39" stroke-width="1.5"/>
      <polygon points="-125,0 0,60 0,84 -125,24" fill="#FF5C39" fill-opacity=".10" stroke="#FF5C39" stroke-width="1.5"/>
      <polygon points="125,0 0,60 0,84 125,24" fill="#FF5C39" fill-opacity=".06" stroke="#FF5C39" stroke-width="1.5"/>
    </g></g>
  </g>
  <g class="mono" font-size="18" fill="#8B949E" letter-spacing=".5">
    <text x="1040" y="128">frontend</text>
    <text x="1040" y="188">backend</text>
    <text x="1040" y="248">datos</text>
    <text x="1040" y="308">devops</text>
  </g>
</svg>
