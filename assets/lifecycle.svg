<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 215" role="img" aria-labelledby="t">
  <title id="t">Ciclo de vida del software: análisis de requerimientos, implementación, pruebas y puesta en producción</title>
  <style>
    :root{--fg:#1F2328;--mut:#656D76;--ln:#D0D7DE;--ac:#D93A17;--bg:#FFFFFF}
    @media (prefers-color-scheme:dark){:root{--fg:#E6EDF3;--mut:#8B949E;--ln:#3D4650;--ac:#FF6A45;--bg:#0D1117}}
    .serif{font-family:Georgia,'Times New Roman','DejaVu Serif',serif}
    .mono{font-family:'SF Mono','Fira Code',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
  </style>
  <text x="10" y="26" class="mono" font-size="16" letter-spacing="2" fill="var(--mut)">CICLO DE VIDA DEL SOFTWARE</text>
  <line x1="125" y1="95" x2="875" y2="95" stroke="var(--ln)" stroke-width="2"/>
  <line x1="125" y1="95" x2="875" y2="95" stroke="var(--ac)" stroke-width="2" stroke-dasharray="6 10"/>
  <g class="mono" font-size="20" font-weight="700" fill="var(--ac)" text-anchor="middle">
    <text x="125" y="64">01</text><text x="375" y="64">02</text><text x="625" y="64">03</text><text x="875" y="64">04</text>
  </g>
  <g stroke="var(--ac)" stroke-width="2.5" fill="var(--bg)">
    <circle cx="125" cy="95" r="11"/><circle cx="375" cy="95" r="11"/><circle cx="625" cy="95" r="11"/>
    <circle cx="875" cy="95" r="11" fill="var(--ac)"/>
  </g>
  <g class="serif" font-size="27" font-weight="700" fill="var(--fg)" text-anchor="middle">
    <text x="125" y="152">Análisis de</text><text x="125" y="186">requerimientos</text>
    <text x="375" y="169">Implementación</text>
    <text x="625" y="169">Pruebas</text>
    <text x="875" y="152">Puesta en</text><text x="875" y="186">producción</text>
  </g>
</svg>
